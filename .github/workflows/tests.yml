name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Full suite on every platform
        run: uv run python -m unittest discover -s tests -v
      - name: Install native proxy test dependencies
        if: runner.os == 'Windows'
        run: choco install nmap --yes --no-progress --limit-output
      - name: Real Windows SSH and SOCKS5 acceptance
        if: runner.os == 'Windows'
        env:
          SLAI_NATIVE_ACCEPTANCE: '1'
        run: uv run --with paramiko python -m unittest discover -s tests -p test_windows_integration.py -v
      - run: uv run python -m compileall -q scripts
      - run: uv run main.py cci --help
      - run: uv run main.py dnat --help
      - run: uv run main.py acp --help

# 复制为 config.toml 后编辑。所有脚本只读取仓库根目录的 config.toml。
# 相对路径以仓库根目录为基准；~ 表示用户主目录。Windows 路径推荐用 C:/Users/name/...。
[paths]
home = "~/.sco"
data_home = "~/.local/share/sco"
config = "~/.config/sco"

[sco]
# 安装并配置流程会在初始化阶段交互补齐以下三项。
access_key_id = ""
access_key_secret = ""
region = ""
# zone 默认 cn-sh-01；留空或省略时也使用该默认值。
zone = "cn-sh-01"
# profile 留空时交互询问，回车使用 default。
profile = "default"
language = "zh-CN"

[install]
# Linux/macOS 安装包随 Git 分发；Windows 安装器缓存于此，Windows runtime 首次在线下载。
cache_dir = "vendor/sco"

[regions]
# Region code 与名称，来自随仓库分发的官方地区清单。
cnsh01 = "cn-sh-01"
cnsh02 = "cn-sh-02"
cnyc01 = "cn-yc-01"

[docker]
# 每次上传都询问镜像信息；以下为上次使用值或默认值。密码由 Docker 管理。
registry = "registry.cn-sh-01.sensecore.cn"
username = ""
namespace = ""
source_image = ""
image_name = ""
tag = "latest"

[cci]
# 创建 CCI 时的输入默认值；工作空间、资源池、规格和存储通过云端列表选择。
# 留空或省略也使用此默认镜像；可以换成自己的完整远端镜像地址。
image = "registry.cn-sh-01.sensecore.cn/lepton-trainingjob/ngc-pytorch:25.06-cu12.9-py3.12-ubuntu24.04"
# 默认启用 SSH：自动启动 sshd，开放 22，使用公钥登录 root。
ssh_enabled = true
# 公钥路径；留空时查找 ~/.ssh/*.pub，多项时列表选择。绝不填写私钥。
ssh_public_key = ""
# SSH 模式下留空以前台 sshd 保持运行；非空则启动 sshd 后执行该命令。
command = ""

[acp]
# ACP 默认使用系统网络；代理开关见 [network]。
# 留空时使用默认 NGC 镜像；任务命令始终交互确认。
image = ""
command = ""

[workspace]
# 主菜单 7 选择后自动记录完整资源范围；留空时各服务交互选择。
name = ""
region = ""
subscription_name = ""
resource_group_name = ""
zone = ""
id = ""

# 统一网络配置；SSH 自动使用已填写的 SOCKS5，ACP 单独选择是否使用。
[network]
acp_proxy = false

# server 留空则 SSH 直连，用户名和密码须同时填写或同时留空。
[network.socks5]
server = ""
port = 1080
username = ""
password = ""
